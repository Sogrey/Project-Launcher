# 三平台打包 → Artifact + GitHub Release（暂不签名 / 不公证）
#
# 触发：
#   - 推送 tag：v*（推荐 v1.0.0）
#   - Actions 页手动 Run workflow（可填 tag，默认用 package 版本）
#
# 先单独创建/复用 Release，再矩阵上传，避免多 job 抢建 Release 竞态。
#
# 仓库设置：Settings → Actions → General → Workflow permissions
#   勾选 “Read and write permissions”

name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag（如 v1.0.0；留空则用 v + package 版本）"
        required: false
        type: string
      prerelease:
        description: "标记为 pre-release（内测建议 true）"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      release_id: ${{ steps.ensure.outputs.result }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve release tag
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag_name }}"
            if [ -z "$TAG" ]; then
              VER=$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")
              TAG="v${VER}"
            fi
            PRE="${{ inputs.prerelease }}"
          else
            TAG="${{ github.ref_name }}"
            PRE="true"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRE}" >> "$GITHUB_OUTPUT"
          echo "Resolved tag=${TAG} prerelease=${PRE}"

      - name: Ensure GitHub Release exists
        id: ensure
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            const prerelease = process.env.PRERELEASE === 'true';
            const { owner, repo } = context.repo;
            const body = [
              `## Project Launcher ${tag}`,
              '',
              '多平台安装包（**暂未代码签名 / 未 Apple 公证**）。',
              '',
              '| 平台 | 产物 |',
              '|---|---|',
              '| Windows | NSIS `.exe` |',
              '| macOS | `.dmg`（Arm / Intel 各一份；Gatekeeper 可能提示「无法验证开发者」） |',
              '| Linux | `.AppImage` + `.deb` |',
              '',
              '### 内测说明',
              '- Windows：若 SmartScreen 拦截，选「仍要运行」',
              '- macOS：若无法打开，可右键 → 打开，或在「系统设置 → 隐私与安全性」允许',
              '- Linux：`chmod +x *.AppImage` 后运行',
            ].join('\n');

            let release;
            try {
              ({ data: release } = await github.rest.repos.getReleaseByTag({
                owner,
                repo,
                tag,
              }));
              core.info(`Reusing existing release id=${release.id} tag=${tag}`);
              await github.rest.repos.updateRelease({
                owner,
                repo,
                release_id: release.id,
                name: `Project Launcher ${tag}`,
                body,
                draft: false,
                prerelease,
              });
            } catch (e) {
              if (e.status !== 404) throw e;
              ({ data: release } = await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                name: `Project Launcher ${tag}`,
                body,
                draft: false,
                prerelease,
              }));
              core.info(`Created release id=${release.id} tag=${tag}`);
            }
            return release.id;

  publish-tauri:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            name: macos-aarch64
            args: "--target aarch64-apple-darwin --bundles dmg"
          - platform: macos-latest
            name: macos-x86_64
            args: "--target x86_64-apple-darwin --bundles dmg"
          - platform: ubuntu-22.04
            name: linux-x86_64
            args: "--bundles appimage,deb"
          - platform: windows-latest
            name: windows-x86_64
            args: "--bundles nsis"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and upload to GitHub Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: project-launcher-${{ matrix.name }}-${{ needs.create-release.outputs.tag }}
          path: |
            src-tauri/target/**/release/bundle/nsis/*
            src-tauri/target/**/release/bundle/dmg/*
            src-tauri/target/**/release/bundle/appimage/*
            src-tauri/target/**/release/bundle/deb/*
          if-no-files-found: warn
          retention-days: 30
